AutoName: DevBrowser
Summary: DevBrowser is a fully open-source, feature-packed mobile web browser designed for developers, privacy advocates, and everyday users
Description: |-
  DevBrowser is a fully open-source, feature-packed mobile web browser designed for developers, privacy advocates, and everyday users.

  Features:
  - Integrated Chrome DevTools (DOM inspection, live CSS editing, JavaScript console, network waterfall analysis)
  - Elements, Console, Sources, Storage, Performance, and CSSOM inspection panels
  - Built-in error debugger with custom HTTP error pages and sandbox test presets
  - Multi-tab management with incognito and persistent state management
  - Modern Material 3 expressive user interface with dynamic theme colors
  - Bookmarks and History management
  - 100% Free and Open Source (FOSS) with no proprietary trackers, analytics, or Google Mobile Services (GMS) dependencies

